<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title description">
<title id="title">4 · Connect rainfall supply to usable soil storage</title><desc id="description">Plan and section of an illustrative contour basin and planting station, with flow arrows, donor catchment, mineral soil storage and a safe overflow. No basin size or excavation depth is prescribed.</desc>
<defs>
 <marker id="end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker>
 <marker id="start" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker>
 <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 12L12 0" stroke="#89867e" stroke-width="1"/></pattern>
</defs>
<rect width="1400" height="850" fill="#fbf8f0"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="50" y="58" fill="#243b32" font-size="32" font-weight="650" text-anchor="start">4 · Connect rainfall supply to usable soil storage</text>
<text x="50" y="96" fill="#243b32" font-size="21" font-weight="400" text-anchor="start">A catchment redistributes water. It does not create additional rain or guarantee root access.</text>
<rect x="50" y="145" width="620" height="595" fill="#fffdf7" stroke="#ded8c8" rx="10"/><text x="75" y="187" fill="#243b32" font-size="24" font-weight="650" text-anchor="start">Plan · local donor area</text><rect x="88" y="219" width="540" height="205" fill="#ece4d4" stroke="#b4ac99" rx="0"/><text x="356" y="257" fill="#243b32" font-size="22" font-weight="400" text-anchor="middle">Donor catchment area A-c</text><path d="M180 285L180 420" fill="none" stroke="#246e9b" stroke-width="2.5"  marker-end="url(#end)"/><path d="M350 285L350 420" fill="none" stroke="#246e9b" stroke-width="2.5"  marker-end="url(#end)"/><path d="M520 285L520 420" fill="none" stroke="#246e9b" stroke-width="2.5"  marker-end="url(#end)"/><path d="M140 450Q145 610 360 630Q565 610 570 450" fill="none" stroke="#98724e" stroke-width="12" /><path d="M175 455Q180 574 360 590Q530 574 535 455" fill="#d8e8ec" stroke="#246e9b" stroke-width="2" /><rect x="328" y="607" width="66" height="48" fill="#9bb69c" stroke="#356b50" rx="2"/><text x="360" y="568" fill="#243b32" font-size="18" font-weight="400" text-anchor="middle">Station on shoulder</text><path d="M360 576V604" fill="none" stroke="#356b50" stroke-width="1.5" /><path d="M552 574L602 574" fill="none" stroke="#fbf8f0" stroke-width="18" /><path d="M570 574L624 617" fill="none" stroke="#246e9b" stroke-width="2.5"  marker-end="url(#end)"/><text x="490" y="676" fill="#246e9b" font-size="18" font-weight="400" text-anchor="start">Overflow to</text><text x="490" y="700" fill="#246e9b" font-size="18" font-weight="400" text-anchor="start">stable ground</text><text x="80" y="725" fill="#243b32" font-size="18" font-weight="400" text-anchor="start">Bund follows the contour; no scale implied.</text><rect x="710" y="145" width="640" height="595" fill="#fffdf7" stroke="#ded8c8" rx="10"/><text x="735" y="187" fill="#243b32" font-size="24" font-weight="650" text-anchor="start">Section · temporary capture, then infiltration</text><path d="M748 290L920 348L1000 354L1058 326L1180 326L1315 365L1315 620L748 620Z" fill="#e5d6bd" stroke="#98724e" stroke-width="2" /><path d="M884 334L1000 354L1037 327L884 327Z" fill="#bfdde6" stroke="#246e9b" stroke-width="1" /><path d="M767 255L900 302" fill="none" stroke="#246e9b" stroke-width="2.5"  marker-end="url(#end)"/><text x="765" y="235" fill="#246e9b" font-size="20" font-weight="400" text-anchor="start">Runoff</text><rect x="1084" y="326" width="70" height="105" fill="#9bb69c" stroke="#356b50" rx="2"/><text x="1119" y="287" fill="#243b32" font-size="20" font-weight="400" text-anchor="middle">Root ball</text><path d="M942 382L942 513" fill="none" stroke="#246e9b" stroke-width="2.5"  marker-end="url(#end)"/><path d="M1005 405L1045 531" fill="none" stroke="#246e9b" stroke-width="2.5"  marker-end="url(#end)"/><path d="M888 547Q1073 611 1245 517" fill="none" stroke="#246e9b" stroke-width="2" stroke-dasharray="7 7"/><text x="742" y="660" fill="#243b32" font-size="20" font-weight="400" text-anchor="start">Storage depends on the profile, not just basin size.</text><text x="742" y="691" fill="#243b32" font-size="20" font-weight="400" text-anchor="start">Protect the collar and provide an overflow.</text><text x="50" y="775" fill="#243b32" font-size="23" font-weight="600" text-anchor="start">Event runoff delivered (L) = rain (mm) × donor area (m²) × runoff coefficient × delivery efficiency</text>
<path d="M50 792H1350" fill="none" stroke="#d5cfbf" stroke-width="1" />
<text x="50" y="824" fill="#526358" font-size="18" font-weight="400" text-anchor="start">Geometric teaching scheme · not to scale · source context and limitations are in LEARN-007</text>
</g></svg>