<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title description">
<title id="title">2 · Preparation depth is not planting depth</title><desc id="description">A rectangular root ball is seated at finished ground level, above a deeper mineral-soil preparation zone. Independent arrows mark root-ball height and preparation width/depth.</desc>
<defs>
 <marker id="end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker>
 <marker id="start" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker>
 <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 12L12 0" stroke="#89867e" stroke-width="1"/></pattern>
</defs>
<rect width="1400" height="850" fill="#fbf8f0"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="50" y="58" fill="#243b32" font-size="32" font-weight="650" text-anchor="start">2 · Preparation depth is not planting depth</text>
<text x="50" y="96" fill="#243b32" font-size="21" font-weight="400" text-anchor="start">Conceptual backfilled section: all dimensions follow the actual stock and soil investigation.</text>
<rect x="55" y="155" width="840" height="548" fill="#fffdf7" stroke="#ded8c8" rx="12"/><rect x="90" y="300" width="760" height="350" fill="#e5d6bd" stroke="none" rx="0"/><rect x="190" y="300" width="550" height="350" fill="#d4c8b1" stroke="#98724e" rx="3"/><path d="M90 300H850" fill="none" stroke="#356b50" stroke-width="3" /><text x="92" y="280" fill="#356b50" font-size="21" font-weight="600" text-anchor="start">Final settled soil level</text><rect x="395" y="300" width="145" height="155" fill="#9bb69c" stroke="#356b50" rx="3"/><text x="468" y="365" fill="#243b32" font-size="22" font-weight="600" text-anchor="middle">Root ball</text><text x="468" y="397" fill="#243b32" font-size="18" font-weight="400" text-anchor="middle">No pot</text><rect x="380" y="455" width="175" height="28" fill="#b6a185" stroke="none" rx="0"/><path d="M220 510l65 40 -30 46M315 490l-20 65 30 62M610 497l45 46 -25 58M700 510l-35 56 23 54" fill="none" stroke="#98724e" stroke-width="3" /><path d="M565 305L565 452" fill="none" stroke="#356b50" stroke-width="2.5" marker-start="url(#start)" marker-end="url(#end)"/><text x="585" y="382" fill="#356b50" font-size="21" font-weight="400" text-anchor="start">H-ball</text><path d="M150 305L150 648" fill="none" stroke="#98724e" stroke-width="2.5" marker-start="url(#start)" marker-end="url(#end)"/><text x="109" y="493" fill="#98724e" font-size="20" font-weight="400" text-anchor="middle">D-prep</text><path d="M194 674L736 674" fill="none" stroke="#98724e" stroke-width="2.5" marker-start="url(#start)" marker-end="url(#end)"/><text x="465" y="692" fill="#98724e" font-size="20" font-weight="400" text-anchor="middle">W-prep</text><path d="M399 245L536 245" fill="none" stroke="#356b50" stroke-width="2.5" marker-start="url(#start)" marker-end="url(#end)"/><text x="468" y="227" fill="#356b50" font-size="20" font-weight="400" text-anchor="middle">W-ball</text><path d="M362 507L340 550" fill="none" stroke="#356b50" stroke-width="2.5"  marker-end="url(#end)"/><path d="M580 507L604 550" fill="none" stroke="#356b50" stroke-width="2.5"  marker-end="url(#end)"/><text x="467" y="604" fill="#243b32" font-size="21" font-weight="400" text-anchor="middle">Prepared mineral soil</text><text x="935" y="197" fill="#243b32" font-size="25" font-weight="650" text-anchor="start">Separate three decisions</text><text x="935" y="244" fill="#243b32" font-size="21" font-weight="400" text-anchor="start">1  Where the collar sits</text><text x="935" y="275" fill="#243b32" font-size="21" font-weight="400" text-anchor="start">    relative to finished ground.</text><text x="935" y="341" fill="#243b32" font-size="21" font-weight="400" text-anchor="start">2  What soil volume is</text><text x="935" y="372" fill="#243b32" font-size="21" font-weight="400" text-anchor="start">    prepared around the plant.</text><text x="935" y="438" fill="#243b32" font-size="21" font-weight="400" text-anchor="start">3  Whether that volume connects</text><text x="935" y="469" fill="#243b32" font-size="21" font-weight="400" text-anchor="start">    to usable soil beyond it.</text><text x="935" y="553" fill="#243b32" font-size="20" font-weight="400" text-anchor="start">Stable support beneath the ball;</text><text x="935" y="585" fill="#243b32" font-size="20" font-weight="400" text-anchor="start">no deep loose compost bed.</text><text x="935" y="617" fill="#243b32" font-size="20" font-weight="400" text-anchor="start">Deeper work needs diagnosis,</text><text x="935" y="649" fill="#243b32" font-size="20" font-weight="400" text-anchor="start">suitable backfill and drainage.</text><text x="55" y="753" fill="#356b50" font-size="25" font-weight="600" text-anchor="start">Keep the collar at finished grade; choose D-prep from the soil diagnosis.</text>
<path d="M50 792H1350" fill="none" stroke="#d5cfbf" stroke-width="1" />
<text x="50" y="824" fill="#526358" font-size="18" font-weight="400" text-anchor="start">Geometric teaching scheme · not to scale · source context and limitations are in LEARN-007</text>
