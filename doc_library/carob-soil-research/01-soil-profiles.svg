<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title description">
<title id="title">1 · Diagnose the profile before choosing a depth</title><desc id="description">Three conceptual cross-sections with labelled root-ball rectangles. Each requires a different diagnosis; none prescribes a standard pit depth.</desc>
<defs>
 <marker id="end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker>
 <marker id="start" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker>
 <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 12L12 0" stroke="#89867e" stroke-width="1"/></pattern>
</defs>
<rect width="1400" height="850" fill="#fbf8f0"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="50" y="58" fill="#243b32" font-size="32" font-weight="650" text-anchor="start">1 · Diagnose the profile before choosing a depth</text>
<text x="50" y="96" fill="#243b32" font-size="21" font-weight="400" text-anchor="start">Stoniness, a restrictive horizon and continuous bedrock are different problems.</text>
<rect x="50" y="137" width="400" height="610" fill="#fffdf7" stroke="#ded8c8" rx="10"/><text x="68" y="177" fill="#243b32" font-size="21" font-weight="650" text-anchor="start">A · Stones within rootable soil</text><rect x="70" y="248" width="360" height="296" fill="#e5d6bd" stroke="none" rx="0"/><path d="M70 248H430" fill="none" stroke="#356b50" stroke-width="3" /><rect x="217" y="248" width="66" height="84" fill="#9bb69c" stroke="#356b50" rx="0"/><text x="250" y="229" fill="#243b32" font-size="18" font-weight="400" text-anchor="middle">Root ball</text><ellipse cx="115" cy="338" rx="22.5" ry="12.0" fill="#a7a49b"/><ellipse cx="317" cy="370" rx="29.0" ry="15.0" fill="#a7a49b"/><ellipse cx="162" cy="446" rx="32.5" ry="14.0" fill="#a7a49b"/><ellipse cx="289" cy="480" rx="28.0" ry="11.0" fill="#a7a49b"/><ellipse cx="336" cy="289" rx="21.5" ry="9.0" fill="#a7a49b"/><ellipse cx="92" cy="501" rx="19.5" ry="9.0" fill="#a7a49b"/><path d="M250 347L250 486" fill="none" stroke="#356b50" stroke-width="2.5"  marker-end="url(#end)"/><path d="M290 364L370 438" fill="none" stroke="#356b50" stroke-width="2.5"  marker-end="url(#end)"/><text x="82" y="580" fill="#243b32" font-size="17" font-weight="400" text-anchor="start">Usable profile extends below the drawing</text><text x="70" y="631" fill="#243b32" font-size="17" font-weight="400" text-anchor="start">Fine earth connects around stones.</text><text x="70" y="660" fill="#243b32" font-size="17" font-weight="400" text-anchor="start">Check storage and root-ball contact.</text><text x="70" y="689" fill="#243b32" font-size="17" font-weight="400" text-anchor="start">A deeper shaft may add little.</text><rect x="500" y="137" width="400" height="610" fill="#fffdf7" stroke="#ded8c8" rx="10"/><text x="518" y="177" fill="#243b32" font-size="21" font-weight="650" text-anchor="start">B · A restriction above usable soil</text><rect x="520" y="248" width="360" height="296" fill="#e5d6bd" stroke="none" rx="0"/><path d="M520 248H880" fill="none" stroke="#356b50" stroke-width="3" /><rect x="667" y="248" width="66" height="84" fill="#9bb69c" stroke="#356b50" rx="0"/><text x="700" y="229" fill="#243b32" font-size="18" font-weight="400" text-anchor="middle">Root ball</text><rect x="520" y="382" width="360" height="45" fill="#a7a49b" stroke="none" rx="0"/><rect x="520" y="382" width="360" height="45" fill="url(#hatch)" stroke="none" rx="0"/><path d="M645 379l12 18 -15 15 15 20M754 380l-12 20 17 15 -14 15" fill="none" stroke="#356b50" stroke-width="5" /><path d="M700 345L700 490" fill="none" stroke="#356b50" stroke-width="2.5"  marker-end="url(#end)"/><text x="530" y="372" fill="#243b32" font-size="18" font-weight="400" text-anchor="start">Restricted layer</text><text x="532" y="580" fill="#243b32" font-size="17" font-weight="400" text-anchor="start">Depth must follow the diagnosed barrier</text><text x="520" y="631" fill="#243b32" font-size="17" font-weight="400" text-anchor="start">Identify barrier thickness and what lies below.</text><text x="520" y="660" fill="#243b32" font-size="17" font-weight="400" text-anchor="start">Targeted loosening may restore access.</text><text x="520" y="689" fill="#243b32" font-size="17" font-weight="400" text-anchor="start">Confirm drainage after preparation.</text><rect x="950" y="137" width="400" height="610" fill="#fffdf7" stroke="#ded8c8" rx="10"/><text x="968" y="177" fill="#243b32" font-size="21" font-weight="650" text-anchor="start">C · Shallow soil over continuous rock</text><rect x="970" y="248" width="360" height="296" fill="#e5d6bd" stroke="none" rx="0"/><path d="M970 248H1330" fill="none" stroke="#356b50" stroke-width="3" /><rect x="1117" y="248" width="66" height="84" fill="#9bb69c" stroke="#356b50" rx="0"/><text x="1150" y="229" fill="#243b32" font-size="18" font-weight="400" text-anchor="middle">Root ball</text><rect x="970" y="358" width="360" height="186" fill="#a7a49b" stroke="none" rx="0"/><rect x="970" y="358" width="360" height="186" fill="url(#hatch)" stroke="none" rx="0"/><text x="1150" y="452" fill="#243b32" font-size="22" font-weight="600" text-anchor="middle">Continuous rock</text><path d="M1230 374V513" fill="none" stroke="#a34d46" stroke-width="3" stroke-dasharray="8 7"/><text x="982" y="580" fill="#243b32" font-size="17" font-weight="400" text-anchor="start">Do not assume a drilled hole has an outlet</text><text x="970" y="631" fill="#243b32" font-size="17" font-weight="400" text-anchor="start">Digging deeper is not automatically useful.</text><text x="970" y="660" fill="#243b32" font-size="17" font-weight="400" text-anchor="start">Seek a better pocket or evaluate an</text><text x="970" y="689" fill="#243b32" font-size="17" font-weight="400" text-anchor="start">engineered, connected soil volume.</text>
<path d="M50 792H1350" fill="none" stroke="#d5cfbf" stroke-width="1" />
<text x="50" y="824" fill="#526358" font-size="18" font-weight="400" text-anchor="start">Geometric teaching scheme · not to scale · source context and limitations are in LEARN-007</text>
</g></svg>