<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title description">
<title id="title">3 · Match the material to the problem</title><desc id="description">Three soil sections compare connected mineral soil, a rich isolated pocket with possible water accumulation, and a gravel layer that can delay drainage at a fine-over-coarse boundary.</desc>
<defs>
 <marker id="end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker>
 <marker id="start" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker>
 <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 12L12 0" stroke="#89867e" stroke-width="1"/></pattern>
</defs>
<rect width="1400" height="850" fill="#fbf8f0"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="50" y="58" fill="#243b32" font-size="32" font-weight="650" text-anchor="start">3 · Match the material to the problem</text>
<text x="50" y="96" fill="#243b32" font-size="21" font-weight="400" text-anchor="start">Water retention, infiltration and drainage are different properties. No universal compost/sand recipe.</text>
<rect x="50" y="148" width="400" height="587" fill="#fffdf7" stroke="#ded8c8" rx="10"/><text x="68" y="190" fill="#243b32" font-size="23" font-weight="650" text-anchor="start">A · Connected mineral soil</text><rect x="72" y="295" width="356" height="280" fill="#e5d6bd" stroke="none" rx="0"/><path d="M72 295H428" fill="none" stroke="#356b50" stroke-width="3" /><path d="M130 296L156 515H344L370 296" fill="#d5c5aa" stroke="#98724e" stroke-width="3" /><rect x="215" y="295" width="70" height="110" fill="#9bb69c" stroke="#356b50" rx="2"/><path d="M195 445L115 470" fill="none" stroke="#356b50" stroke-width="2.5"  marker-end="url(#end)"/><path d="M305 445L385 470" fill="none" stroke="#356b50" stroke-width="2.5"  marker-end="url(#end)"/><text x="72" y="625" fill="#243b32" font-size="19" font-weight="400" text-anchor="start">Compatible material and soil contact.</text><text x="72" y="655" fill="#243b32" font-size="19" font-weight="400" text-anchor="start">Investigate any restrictive layer.</text><text x="72" y="685" fill="#243b32" font-size="19" font-weight="400" text-anchor="start">Maintain a stable supporting seat.</text><rect x="500" y="148" width="400" height="587" fill="#fffdf7" stroke="#ded8c8" rx="10"/><text x="518" y="190" fill="#243b32" font-size="23" font-weight="650" text-anchor="start">B · Isolated rich pocket</text><rect x="522" y="295" width="356" height="280" fill="#e5d6bd" stroke="none" rx="0"/><path d="M522 295H878" fill="none" stroke="#356b50" stroke-width="3" /><rect x="610" y="295" width="180" height="250" fill="#7d624a" stroke="#98724e" rx="0"/><rect x="665" y="295" width="70" height="110" fill="#9bb69c" stroke="#356b50" rx="2"/><rect x="613" y="470" width="174" height="72" fill="#8ab6ca" stroke="none" rx="0"/><path d="M562 422L605 459" fill="none" stroke="#246e9b" stroke-width="2.5"  marker-end="url(#end)"/><path d="M838 422L795 459" fill="none" stroke="#246e9b" stroke-width="2.5"  marker-end="url(#end)"/><text x="700" y="573" fill="#246e9b" font-size="18" font-weight="400" text-anchor="middle">Possible water accumulation</text><text x="522" y="625" fill="#243b32" font-size="19" font-weight="400" text-anchor="start">A permeable pocket is not an outlet.</text><text x="522" y="655" fill="#243b32" font-size="19" font-weight="400" text-anchor="start">Risk depends on surrounding drainage.</text><text x="522" y="685" fill="#243b32" font-size="19" font-weight="400" text-anchor="start">Organic fill may also settle.</text><rect x="950" y="148" width="400" height="587" fill="#fffdf7" stroke="#ded8c8" rx="10"/><text x="968" y="190" fill="#243b32" font-size="23" font-weight="650" text-anchor="start">C · Abrupt gravel base</text><rect x="972" y="295" width="356" height="280" fill="#e5d6bd" stroke="none" rx="0"/><path d="M972 295H1328" fill="none" stroke="#356b50" stroke-width="3" /><rect x="1040" y="295" width="220" height="250" fill="#d5c5aa" stroke="#98724e" rx="0"/><rect x="1115" y="295" width="70" height="110" fill="#9bb69c" stroke="#356b50" rx="2"/><rect x="1042" y="459" width="216" height="31" fill="#8ab6ca" stroke="none" rx="0"/><rect x="1042" y="491" width="216" height="52" fill="#a7a49b" stroke="none" rx="0"/><ellipse cx="1062" cy="514" rx="13" ry="10" fill="#777970"/><ellipse cx="1096" cy="514" rx="13" ry="10" fill="#777970"/><ellipse cx="1130" cy="514" rx="13" ry="10" fill="#777970"/><ellipse cx="1164" cy="514" rx="13" ry="10" fill="#777970"/><ellipse cx="1198" cy="514" rx="13" ry="10" fill="#777970"/><ellipse cx="1232" cy="514" rx="13" ry="10" fill="#777970"/><text x="1150" y="573" fill="#246e9b" font-size="18" font-weight="400" text-anchor="middle">Texture boundary</text><text x="972" y="625" fill="#243b32" font-size="19" font-weight="400" text-anchor="start">Coarse material below finer soil</text><text x="972" y="655" fill="#243b32" font-size="19" font-weight="400" text-anchor="start">can delay downward movement.</text><text x="972" y="685" fill="#243b32" font-size="19" font-weight="400" text-anchor="start">Gravel alone is not drainage.</text><text x="50" y="771" fill="#243b32" font-size="22" font-weight="600" text-anchor="start">These are mechanisms to assess, not a prediction that every amended planting hole will fail.</text>
<path d="M50 792H1350" fill="none" stroke="#d5cfbf" stroke-width="1" />
<text x="50" y="824" fill="#526358" font-size="18" font-weight="400" text-anchor="start">Geometric teaching scheme · not to scale · source context and limitations are in LEARN-007</text>
</g></svg>