<text x="98" y="578" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="start" fill="#137fa7">Matched evidence at each survey</text>
<text x="98" y="607" font-family="sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#19343e">Drone image + ground alive/dead inspection</text>
<text x="98" y="635" font-family="sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#19343e">Probe values + weather + emitter delivery</text>
<text x="98" y="663" font-family="sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#19343e">Field-checked suspected faults and healthy controls</text>
<rect x="735" y="545" width="585" height="175" rx="9" fill="#edf4f3" stroke="#91aaa6" stroke-width="2"/>
<text x="753" y="578" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="start" fill="#b77420">Evaluate on held-out blocks / dates</text>
<text x="753" y="607" font-family="sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#19343e">False alarms + missed stressed plants</text>
<text x="753" y="635" font-family="sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#19343e">Value beyond RGB and ground sensors</text>
<text x="753" y="663" font-family="sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#19343e">Cost per useful finding and inspection time</text>
<text x="80" y="776" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#19343e">Keep “unknown / obscured” separate from “dead”. Set decision criteria before looking at the results.</text>
