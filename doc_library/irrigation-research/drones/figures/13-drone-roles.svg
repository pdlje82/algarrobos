<text x="55" y="58" font-family="sans-serif" font-size="34" font-weight="bold" text-anchor="start" fill="#19343e">13  What a drone adds to a restoration site</text>
<text x="55" y="99" font-family="sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#19343e">Author assessment from the sources: ready hardware does not guarantee a validated ecological decision.</text>
