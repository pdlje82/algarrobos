<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
<title>Where to invest effort in a repairable demonstrator</title>
<rect width="1400" height="850" fill="#ffffff"/>
<text x="55" y="58" font-family="sans-serif" font-size="34" font-weight="bold" text-anchor="start" fill="#19343e">20  Where to invest effort in a repairable demonstrator</text>
<text x="55" y="99" font-family="sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#19343e">Author proposal: borrow or contract aircraft first; build serviceable field technology and transparent evidence.</text>
<line x1="55" y1="124" x2="1345" y2="124" stroke="#b7cbc9" stroke-width="2"/>
<text x="55" y="820" font-family="sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#19343e">ALGARROBOS  /  LEARN-016  /  3 NOV 2026  /  CONCEPT ONLY - NOT TO SCALE</text>
<circle cx="240" cy="220" r="42" fill="#d9ebf2" stroke="#137fa7" stroke-width="2"/>
<text x="240" y="232" font-family="sans-serif" font-size="34" font-weight="bold" text-anchor="middle" fill="#137fa7">1</text>
<rect x="70" y="315" width="380" height="215" rx="9" fill="#edf4f3" stroke="#91aaa6" stroke-width="2"/>
<text x="88" y="348" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="start" fill="#137fa7">START WITH SURVEY</text>
<text x="88" y="377" font-family="sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#19343e">Shared RGB mapping service</text>
<text x="88" y="405" font-family="sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#19343e">Plant register + fixed probes</text>
<text x="88" y="433" font-family="sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#19343e">Open exports and reproducible maps</text>
<circle cx="680" cy="220" r="42" fill="#d9ebf2" stroke="#137fa7" stroke-width="2"/>
<text x="680" y="232" font-family="sans-serif" font-size="34" font-weight="bold" text-anchor="middle" fill="#137fa7">2</text>
<rect x="510" y="315" width="380" height="215" rx="9" fill="#edf4f3" stroke="#91aaa6" stroke-width="2"/>
<text x="528" y="348" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="start" fill="#137fa7">TEST EXTRA INFORMATION</text>
<text x="528" y="377" font-family="sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#19343e">Paired thermal / multispectral visit</text>
<text x="528" y="405" font-family="sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#19343e">Measure the useful improvement</text>
<text x="528" y="433" font-family="sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#19343e">Retain uncertainty and raw evidence</text>
<circle cx="1120" cy="220" r="42" fill="#d9ebf2" stroke="#137fa7" stroke-width="2"/>
<text x="1120" y="232" font-family="sans-serif" font-size="34" font-weight="bold" text-anchor="middle" fill="#137fa7">3</text>
<rect x="950" y="315" width="380" height="215" rx="9" fill="#edf4f3" stroke="#91aaa6" stroke-width="2"/>
<text x="968" y="348" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="start" fill="#137fa7">GATE WATER DELIVERY</text>
<text x="968" y="377" font-family="sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#19343e">Meter a basin-dose bench test</text>
<text x="968" y="405" font-family="sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#19343e">Check legal route + field safety</text>
<text x="968" y="433" font-family="sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#19343e">Compare full labour and energy</text>
<rect x="70" y="610" width="600" height="135" rx="9" fill="#edf4f3" stroke="#91aaa6" stroke-width="2"/>
<text x="88" y="643" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="start" fill="#39785b">LOCAL ASSEMBLY OPPORTUNITY</text>
<text x="88" y="672" font-family="sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#19343e">Sensor housings, mounts, wiring, test rigs, GIS joins,</text>
<text x="88" y="700" font-family="sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#19343e">controller software and replaceable ground modules.</text>
<rect x="735" y="610" width="595" height="135" rx="9" fill="#edf4f3" stroke="#91aaa6" stroke-width="2"/>
<text x="753" y="643" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="start" fill="#b77420">AIRCRAFT LIFECYCLE QUESTIONS</text>
<text x="753" y="672" font-family="sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#19343e">Battery health, spares, propellers, calibration, firmware</text>
<text x="753" y="700" font-family="sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#19343e">support, service access and data export.</text>
</svg>