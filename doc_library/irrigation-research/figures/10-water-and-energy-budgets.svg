<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
<title>Water storage and solar energy are different budgets</title>
<rect width="1400" height="850" fill="#ffffff"/>
<text x="55" y="58" font-family="sans-serif" font-size="34" font-weight="bold" text-anchor="start" fill="#19343e">10  Water storage and solar energy are different budgets</text>
<text x="55" y="99" font-family="sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#19343e">Illustrative assumptions for arithmetic only. These are not species watering recommendations.</text>
<line x1="55" y1="124" x2="1345" y2="124" stroke="#b7cbc9" stroke-width="2"/>
<text x="55" y="820" font-family="sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#19343e">ALGARROBOS  /  LEARN-016  /  3 NOV 2026  /  CONCEPT ONLY - NOT TO SCALE</text>
<rect x="65" y="175" width="600" height="120" rx="9" fill="#edf4f3" stroke="#91aaa6" stroke-width="2"/>
<text x="83" y="208" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="start" fill="#137fa7">ONE WATER CELL</text>
<text x="83" y="237" font-family="sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#19343e">40 plants x 5 L per event = 200 L/event</text>
<text x="83" y="265" font-family="sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#19343e">900 L usable tank / 200 L = 4.5 events</text>
<rect x="735" y="175" width="600" height="120" rx="9" fill="#edf4f3" stroke="#91aaa6" stroke-width="2"/>
<text x="753" y="208" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="start" fill="#b77420">PUMP ENERGY</text>
<text x="753" y="237" font-family="sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#19343e">200 L x 15 m head / 30% efficiency</text>
<text x="753" y="265" font-family="sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#19343e">= about 27.3 Wh per irrigation event</text>
<text x="70" y="365" font-family="sans-serif" font-size="25" font-weight="bold" text-anchor="start" fill="#137fa7">Tank usable volume</text>
<rect x="70" y="395" width="590" height="90" rx="9" fill="#e5eff2" stroke="#137fa7" stroke-width="2"/>
<rect x="72" y="397" width="128" height="86" rx="0" fill="#96c6d6" stroke="#137fa7" stroke-width="2"/>
<rect x="203" y="397" width="128" height="86" rx="0" fill="#96c6d6" stroke="#137fa7" stroke-width="2"/>
<rect x="334" y="397" width="128" height="86" rx="0" fill="#96c6d6" stroke="#137fa7" stroke-width="2"/>
<rect x="465" y="397" width="128" height="86" rx="0" fill="#96c6d6" stroke="#137fa7" stroke-width="2"/>
<text x="85" y="450" font-family="sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#19343e">1 event</text>
<text x="220" y="450" font-family="sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#19343e">2</text>
<text x="355" y="450" font-family="sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#19343e">3</text>
<text x="485" y="450" font-family="sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#19343e">4</text>
<text x="70" y="530" font-family="sans-serif" font-size="23" font-weight="normal" text-anchor="start" fill="#19343e">At one event/week: about 31.5 days before reserve.</text>
<text x="70" y="562" font-family="sans-serif" font-size="23" font-weight="normal" text-anchor="start" fill="#19343e">At two events/week: about 15.8 days.</text>
<text x="70" y="594" font-family="sans-serif" font-size="23" font-weight="normal" text-anchor="start" fill="#19343e">Leaks, flushing and heat can shorten this.</text>
<text x="740" y="365" font-family="sans-serif" font-size="25" font-weight="bold" text-anchor="start" fill="#b77420">Always-on electronics can dominate</text>
<text x="740" y="415" font-family="sans-serif" font-size="23" font-weight="normal" text-anchor="start" fill="#19343e">Example gateway: 5 W x 24 h = 120 Wh/day.</text>
<text x="740" y="447" font-family="sans-serif" font-size="23" font-weight="normal" text-anchor="start" fill="#19343e">Add controller load and average pump energy.</text>
<text x="740" y="479" font-family="sans-serif" font-size="23" font-weight="normal" text-anchor="start" fill="#19343e">Do not size all solar from the valve alone.</text>
<text x="740" y="560" font-family="sans-serif" font-size="23" font-weight="normal" text-anchor="start" fill="#19343e">Example: 130 Wh/day total load</text>
<text x="740" y="592" font-family="sans-serif" font-size="23" font-weight="normal" text-anchor="start" fill="#19343e">/ (3 peak-sun-hours x 0.65 system yield)</text>
<text x="740" y="624" font-family="sans-serif" font-size="23" font-weight="normal" text-anchor="start" fill="#19343e">= 67 W calculated panel minimum.</text>
<text x="70" y="745" font-family="sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#19343e">Choose a larger panel after a seasonal design; size battery usable Wh, heat protection and dark-day reserve.</text>
</svg>