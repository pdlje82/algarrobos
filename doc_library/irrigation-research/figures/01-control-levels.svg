<line x1="970" y1="302" x2="970" y2="257" stroke="#39785b" stroke-width="5"/>
<circle cx="957" cy="255" r="17" fill="#dceadd" stroke="#39785b" stroke-width="2"/>
<circle cx="984" cy="248" r="20" fill="#dceadd" stroke="#39785b" stroke-width="2"/>
<line x1="1170" y1="235" x2="1170" y2="265" stroke="#137fa7" stroke-width="3"/>
<line x1="1170" y1="302" x2="1170" y2="257" stroke="#39785b" stroke-width="5"/>
<circle cx="1157" cy="255" r="17" fill="#dceadd" stroke="#39785b" stroke-width="2"/>
<circle cx="1184" cy="248" r="20" fill="#dceadd" stroke="#39785b" stroke-width="2"/>
<text x="725" y="352" font-family="sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#19343e">Valve + group of plants</text>
<rect x="65" y="365" width="530" height="140" rx="9" fill="#edf4f3" stroke="#91aaa6" stroke-width="2"/>
<text x="83" y="398" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="start" fill="#39785b">B  Individual electronic control</text>
<text x="83" y="427" font-family="sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#19343e">Each plant has an addressable valve;</text>
<text x="83" y="455" font-family="sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#19343e">sensing and metering add cost.</text>
<line x1="650" y1="425" x2="1260" y2="425" stroke="#137fa7" stroke-width="5"/>
<line x1="770" y1="425" x2="770" y2="455" stroke="#137fa7" stroke-width="3"/>
