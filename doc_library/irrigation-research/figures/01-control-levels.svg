<rect x="65" y="555" width="530" height="140" rx="9" fill="#edf4f3" stroke="#91aaa6" stroke-width="2"/>
<text x="83" y="588" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="start" fill="#39785b">C  Individual passive control</text>
<text x="83" y="617" font-family="sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#19343e">A ceramic moisture mechanism opens its own valve;</text>
<text x="83" y="645" font-family="sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#19343e">telemetry is separate.</text>
