<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
<title>Three levels of irrigation control</title>
<rect width="1400" height="850" fill="#ffffff"/>
<text x="55" y="58" font-family="sans-serif" font-size="34" font-weight="bold" text-anchor="start" fill="#19343e">01  Three levels of irrigation control</text>
<text x="55" y="99" font-family="sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#19343e">Sensing, valve control and measured delivery are separate design choices.</text>
<line x1="55" y1="124" x2="1345" y2="124" stroke="#b7cbc9" stroke-width="2"/>
<text x="55" y="820" font-family="sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#19343e">ALGARROBOS  /  LEARN-016  /  3 NOV 2026  /  CONCEPT ONLY - NOT TO SCALE</text>
<rect x="65" y="175" width="530" height="140" rx="9" fill="#edf4f3" stroke="#91aaa6" stroke-width="2"/>
<text x="83" y="208" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="start" fill="#39785b">A  Sector control</text>
<text x="83" y="237" font-family="sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#19343e">One valve waters a matched group;</text>
<text x="83" y="265" font-family="sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#19343e">several representative probes.</text>
<line x1="650" y1="235" x2="1260" y2="235" stroke="#137fa7" stroke-width="5"/>
<rect x="650" y="220" width="35" height="30" rx="9" fill="#d9ebf2" stroke="#137fa7" stroke-width="2"/>
<line x1="770" y1="235" x2="770" y2="265" stroke="#137fa7" stroke-width="3"/>
<line x1="770" y1="302" x2="770" y2="257" stroke="#39785b" stroke-width="5"/>
<circle cx="757" cy="255" r="17" fill="#dceadd" stroke="#39785b" stroke-width="2"/>
<circle cx="784" cy="248" r="20" fill="#dceadd" stroke="#39785b" stroke-width="2"/>
