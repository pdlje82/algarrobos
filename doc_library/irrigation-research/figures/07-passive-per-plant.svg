<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
<title>Passive per-plant control with monitored supply</title>
<rect width="1400" height="850" fill="#ffffff"/>
<text x="55" y="58" font-family="sans-serif" font-size="34" font-weight="bold" text-anchor="start" fill="#19343e">07  Passive per-plant control with monitored supply</text>
<text x="55" y="99" font-family="sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#19343e">Tropf-Blumat principle, redrawn: the cone senses; water leaves a separate drip tube.</text>
<line x1="55" y1="124" x2="1345" y2="124" stroke="#b7cbc9" stroke-width="2"/>
<text x="55" y="820" font-family="sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#19343e">ALGARROBOS  /  LEARN-016  /  3 NOV 2026  /  CONCEPT ONLY - NOT TO SCALE</text>
<text x="85" y="190" font-family="sans-serif" font-size="26" font-weight="bold" text-anchor="start" fill="#39785b">DRY SOIL - valve opens</text>
<rect x="85" y="460" width="555" height="230" rx="0" fill="#ecd8b8" stroke="#b8b29f" stroke-width="2"/>
<line x1="140" y1="350" x2="520" y2="350" stroke="#137fa7" stroke-width="6"/>
<rect x="235" y="325" width="140" height="95" rx="9" fill="#e2eadd" stroke="#39785b" stroke-width="2"/>
<text x="253" y="365" font-family="sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#19343e">Valve head</text>
<path d="M260 420 L350 420 L331 570 Q305 610 279 570 Z" fill="#bca48a" stroke="#806b4d" stroke-width="3"/>
<text x="205" y="655" font-family="sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#19343e">Water-filled ceramic cone</text>
<line x1="505" y1="455" x2="505" y2="410" stroke="#39785b" stroke-width="5"/>
<circle cx="492" cy="408" r="17" fill="#dceadd" stroke="#39785b" stroke-width="2"/>
<circle cx="519" cy="401" r="20" fill="#dceadd" stroke="#39785b" stroke-width="2"/>
<circle cx="520" cy="395" r="5" fill="#137fa7" stroke="#39785b" stroke-width="2"/>
<circle cx="520" cy="420" r="5" fill="#137fa7" stroke="#39785b" stroke-width="2"/>
<circle cx="520" cy="445" r="5" fill="#137fa7" stroke="#39785b" stroke-width="2"/>
<line x1="380" y1="350" x2="495" y2="350" stroke="#137fa7" stroke-width="3"/>
<polygon points="495,350 483.2941876694152,355.654551943446 483.2941876694152,344.345448056554" fill="#137fa7"/>
<text x="85" y="735" font-family="sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#19343e">Independent mechanical valve; no battery, radio or moisture data output.</text>
<text x="755" y="190" font-family="sans-serif" font-size="26" font-weight="bold" text-anchor="start" fill="#39785b">MOIST SOIL - valve closes</text>
<rect x="755" y="460" width="555" height="230" rx="0" fill="#d7e6e9" stroke="#b8b29f" stroke-width="2"/>
<line x1="810" y1="350" x2="1190" y2="350" stroke="#137fa7" stroke-width="6"/>
<rect x="905" y="325" width="140" height="95" rx="9" fill="#e2eadd" stroke="#39785b" stroke-width="2"/>
<text x="923" y="365" font-family="sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#19343e">Valve head</text>
<path d="M930 420 L1020 420 L1001 570 Q975 610 949 570 Z" fill="#bca48a" stroke="#806b4d" stroke-width="3"/>
<text x="875" y="655" font-family="sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#19343e">Water-filled ceramic cone</text>
<line x1="1175" y1="455" x2="1175" y2="410" stroke="#39785b" stroke-width="5"/>
<circle cx="1162" cy="408" r="17" fill="#dceadd" stroke="#39785b" stroke-width="2"/>
<circle cx="1189" cy="401" r="20" fill="#dceadd" stroke="#39785b" stroke-width="2"/>
<line x1="1065" y1="330" x2="1095" y2="370" stroke="#a7443c" stroke-width="5"/>
<line x1="1065" y1="370" x2="1095" y2="330" stroke="#a7443c" stroke-width="5"/>
<text x="755" y="735" font-family="sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#19343e">Independent mechanical valve; no battery, radio or moisture data output.</text>
<text x="90" y="285" font-family="sans-serif" font-size="23" font-weight="normal" text-anchor="start" fill="#19343e">Supply still needs clean water, suitable head, commissioning and refill monitoring.</text>
</svg>