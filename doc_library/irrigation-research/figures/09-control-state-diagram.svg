<polygon points="1155,610 1149.345448056554,598.2941876694152 1160.654551943446,598.2941876694152" fill="#a7443c"/>
<line x1="235" y1="610" x2="1155" y2="610" stroke="#a7443c" stroke-width="2" stroke-dasharray="9 7"/>
