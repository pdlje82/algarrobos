<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">Container volume, root-ball geometry and preparation</title><desc id="desc">Two conceptual rectangular one-litre root balls have different dimensions. A cross-section separates root-ball height, root collar position and deeper soil preparation.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<rect x="0" y="0" width="1400" height="900" fill="#fbf8f0" stroke="none" rx="0"/><g font-family="Segoe UI, Arial, sans-serif">
<text x="45" y="58" font-size="32" fill="#243b32" font-weight="650" text-anchor="start">Container volume, root-ball geometry and preparation</text><text x="45" y="98" font-size="21" fill="#243b32" font-weight="400" text-anchor="start">Conceptual geometry explains why a pot size alone cannot determine a planting hole.</text><rect x="45" y="145" width="550" height="640" fill="#fffdf7" stroke="#ded8c8" rx="12"/><text x="70" y="187" font-size="23" fill="#243b32" font-weight="650" text-anchor="start">A. Litres do not define the root-ball shape</text><rect x="110" y="265" width="102.4" height="200" fill="#9bb69c" stroke="#356b50" rx="0"/><rect x="350" y="337" width="128" height="128" fill="#9bb69c" stroke="#356b50" rx="0"/><text x="90" y="559" font-size="21" fill="#243b32" font-weight="400" text-anchor="start">8 x 8 x 15.625 cm</text><text x="90" y="590" font-size="21" fill="#243b32" font-weight="400" text-anchor="start">1 L</text><text x="338" y="559" font-size="21" fill="#243b32" font-weight="400" text-anchor="start">10 cm each side</text><text x="338" y="590" font-size="21" fill="#243b32" font-weight="400" text-anchor="start">1 L</text><text x="70" y="669" font-size="20" fill="#243b32" font-weight="400" text-anchor="start">Arithmetic examples only: real forestry pots taper.</text><text x="70" y="700" font-size="20" fill="#243b32" font-weight="400" text-anchor="start">Measure the actual root-ball width and height.</text><text x="70" y="731" font-size="20" fill="#243b32" font-weight="400" text-anchor="start">Ask for internal dimensions and root architecture.</text><rect x="620" y="145" width="735" height="640" fill="#fffdf7" stroke="#ded8c8" rx="12"/><text x="645" y="187" font-size="23" fill="#243b32" font-weight="650" text-anchor="start">B. Preparation depth differs from planting depth</text><rect x="650" y="352" width="500" height="290" fill="#e5d6bd" stroke="none" rx="0"/><rect x="700" y="352" width="400" height="290" fill="#d5c6aa" stroke="#98724e" rx="0"/><path d="M650 352H1150" fill="none" stroke="#356b50" stroke-width="3" /><rect x="845" y="352" width="110" height="130" fill="#9bb69c" stroke="#356b50" rx="0"/><text x="900" y="409" font-size="19" fill="#243b32" font-weight="600" text-anchor="middle">Root ball</text><text x="900" y="438" font-size="18" fill="#243b32" font-weight="400" text-anchor="middle">No pot</text><path d="M832 483H969" fill="none" stroke="#806447" stroke-width="6" /><text x="650" y="324" font-size="20" fill="#356b50" font-weight="400" text-anchor="start">Root collar at the final settled surface</text><path d="M984 355L984 480" fill="none" stroke="#356b50" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="1000" y="421" font-size="17" fill="#356b50" font-weight="400" text-anchor="start">Ball height</text><path d="M1180 355L1180 640" fill="none" stroke="#246e9b" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="1195" y="465" font-size="17" fill="#246e9b" font-weight="400" text-anchor="start">Prepared</text><text x="1195" y="491" font-size="17" fill="#246e9b" font-weight="400" text-anchor="start">soil</text><text x="1195" y="517" font-size="17" fill="#246e9b" font-weight="400" text-anchor="start">depth</text><text x="645" y="691" font-size="20" fill="#243b32" font-weight="400" text-anchor="start">Stable support beneath the ball; avoid later settlement.</text><text x="645" y="722" font-size="20" fill="#243b32" font-weight="400" text-anchor="start">Choose the preparation envelope from the soil diagnosis.</text><text x="645" y="753" font-size="20" fill="#243b32" font-weight="400" text-anchor="start">No universal hole-size conversion from litres.</text>
<path d="M45 842H1355" fill="none" stroke="#d5cfbf" stroke-width="1" /><text x="45" y="875" font-size="18" fill="#526358" font-weight="400" text-anchor="start">LEARN-008 | Original teaching scheme | Not to scale | Read the source qualifications in the guide</text>
</g></svg>