<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">Designing a mixed restoration mosaic</title><desc id="desc">A conceptual parcel contains three small carob and shrub islands with local runoff capture, scattered shrubs, open ground, and one conditional oak location. No area, spacing or catchment size is prescribed.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<rect x="0" y="0" width="1400" height="900" fill="#fbf8f0" stroke="none" rx="0"/><g font-family="Segoe UI, Arial, sans-serif">
<text x="45" y="58" font-size="32" fill="#243b32" font-weight="650" text-anchor="start">Designing a mixed restoration mosaic</text><text x="45" y="98" font-size="21" fill="#243b32" font-weight="400" text-anchor="start">A project proposal informed by MR1 and MR2; species and earthworks require a site assessment.</text><rect x="45" y="145" width="820" height="650" fill="#eef0dd" stroke="#b8c4a3" rx="12"/><text x="70" y="183" font-size="23" fill="#243b32" font-weight="650" text-anchor="start">Conceptual parcel: retain a varied, open matrix</text><path d="M100 260Q380 220 800 255M90 400Q380 355 800 390M85 545Q410 510 800 525M100 685Q450 650 800 670" fill="none" stroke="#c5cba8" stroke-width="2" /><path d="M160 225L225 303" fill="none" stroke="#246e9b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M500 265L530 331" fill="none" stroke="#246e9b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M300 430L325 497" fill="none" stroke="#246e9b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M165 305Q250 445 335 305" fill="none" stroke="#98724e" stroke-width="5" /><circle cx="250" cy="340" r="32" fill="#356b50" stroke="#356b50" stroke-width="2"/><circle cx="195" cy="345" r="12" fill="#91aa78" stroke="#356b50" stroke-width="2"/><circle cx="303" cy="344" r="12" fill="#91aa78" stroke="#356b50" stroke-width="2"/><circle cx="226" cy="402" r="12" fill="#91aa78" stroke="#356b50" stroke-width="2"/><circle cx="287" cy="395" r="12" fill="#91aa78" stroke="#356b50" stroke-width="2"/><path d="M470 330Q555 470 640 330" fill="none" stroke="#98724e" stroke-width="5" /><circle cx="555" cy="365" r="32" fill="#356b50" stroke="#356b50" stroke-width="2"/><circle cx="500" cy="370" r="12" fill="#91aa78" stroke="#356b50" stroke-width="2"/><circle cx="608" cy="369" r="12" fill="#91aa78" stroke="#356b50" stroke-width="2"/><circle cx="531" cy="427" r="12" fill="#91aa78" stroke="#356b50" stroke-width="2"/><circle cx="592" cy="420" r="12" fill="#91aa78" stroke="#356b50" stroke-width="2"/><path d="M265 520Q350 660 435 520" fill="none" stroke="#98724e" stroke-width="5" /><circle cx="350" cy="555" r="32" fill="#356b50" stroke="#356b50" stroke-width="2"/><circle cx="295" cy="560" r="12" fill="#91aa78" stroke="#356b50" stroke-width="2"/><circle cx="403" cy="559" r="12" fill="#91aa78" stroke="#356b50" stroke-width="2"/><circle cx="326" cy="617" r="12" fill="#91aa78" stroke="#356b50" stroke-width="2"/><circle cx="387" cy="610" r="12" fill="#91aa78" stroke="#356b50" stroke-width="2"/><circle cx="150" cy="570" r="13" fill="#91aa78" stroke="#356b50" stroke-width="2"/><circle cx="650" cy="590" r="13" fill="#91aa78" stroke="#356b50" stroke-width="2"/><circle cx="710" cy="450" r="13" fill="#91aa78" stroke="#356b50" stroke-width="2"/><circle cx="470" cy="690" r="13" fill="#91aa78" stroke="#356b50" stroke-width="2"/><circle cx="150" cy="380" r="13" fill="#91aa78" stroke="#356b50" stroke-width="2"/><circle cx="715" cy="295" r="13" fill="#91aa78" stroke="#356b50" stroke-width="2"/><circle cx="690" cy="680" r="33" fill="#9b873f" stroke="#706337" stroke-width="2"/><text x="70" y="755" font-size="19" fill="#243b32" font-weight="400" text-anchor="start">Symbols locate decisions, not measured roots or mature crown sizes.</text><rect x="890" y="145" width="465" height="650" fill="#fffdf7" stroke="#ded8c8" rx="12"/><text x="915" y="187" font-size="26" fill="#243b32" font-weight="650" text-anchor="start">Design by microsite</text><circle cx="935" cy="241" r="16" fill="#356b50" stroke="#356b50" stroke-width="2"/><text x="965" y="248" font-size="20" fill="#243b32" font-weight="400" text-anchor="start">Carob in favourable pockets</text><circle cx="935" cy="296" r="10" fill="#91aa78" stroke="#356b50" stroke-width="2"/><text x="965" y="303" font-size="20" fill="#243b32" font-weight="400" text-anchor="start">Native shrubs / retained plants</text><circle cx="935" cy="351" r="16" fill="#9b873f" stroke="#706337" stroke-width="2"/><text x="965" y="358" font-size="20" fill="#243b32" font-weight="400" text-anchor="start">Oak only where suitable</text><path d="M920 408Q935 430 950 408" fill="none" stroke="#98724e" stroke-width="4" /><text x="965" y="420" font-size="20" fill="#243b32" font-weight="400" text-anchor="start">Local runoff capture</text><path d="M920 467L950 467" fill="none" stroke="#246e9b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="965" y="474" font-size="20" fill="#243b32" font-weight="400" text-anchor="start">Runoff direction to check</text><text x="915" y="550" font-size="20" fill="#243b32" font-weight="400" text-anchor="start">Keep existing valuable vegetation.</text><text x="915" y="583" font-size="20" fill="#243b32" font-weight="400" text-anchor="start">Leave unsuitable ground unplanted.</text><text x="915" y="616" font-size="20" fill="#243b32" font-weight="400" text-anchor="start">Check overflow routes and erosion.</text><text x="915" y="649" font-size="20" fill="#243b32" font-weight="400" text-anchor="start">Avoid concentrating flow at stems.</text><text x="915" y="682" font-size="20" fill="#243b32" font-weight="400" text-anchor="start">Assess oak and carob separately.</text><text x="915" y="715" font-size="20" fill="#243b32" font-weight="400" text-anchor="start">Set spacing from water and soil,</text><text x="915" y="748" font-size="20" fill="#243b32" font-weight="400" text-anchor="start">not the number of circles shown.</text>
<path d="M45 842H1355" fill="none" stroke="#d5cfbf" stroke-width="1" /><text x="45" y="875" font-size="18" fill="#526358" font-weight="400" text-anchor="start">LEARN-008 | Original teaching scheme | Not to scale | Read the source qualifications in the guide</text>
</g></svg>