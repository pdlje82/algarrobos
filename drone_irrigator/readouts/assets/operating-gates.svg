<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img"><title>Technical feasibility and operating permission are separate</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#317d74"/></marker></defs><rect width="1120" height="620" rx="24" fill="#f5f1e7"/><g font-family="Segoe UI,Arial,sans-serif"><text x="44" y="58" fill="#183b34" font-size="32" font-weight="700" text-anchor="start">Technical feasibility and operating permission are separate</text><text x="44" y="94" fill="#52675e" font-size="19" font-weight="400" text-anchor="start">Planning checklist from the reviewed guidance; no site or flight is cleared.</text><rect x="55" y="150" width="470" height="125" rx="18" fill="#e2eadb" stroke="#b7c7b4"/><text x="75" y="186" fill="#183b34" font-size="22" font-weight="600" text-anchor="start">DEFINE THE OPERATION</text><text x="75" y="215" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Aircraft, water transfer, autonomy, people</text><text x="75" y="244" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Coordinates, dates and operating conditions</text><rect x="595" y="150" width="470" height="125" rx="18" fill="#e2eadb" stroke="#b7c7b4"/><text x="615" y="186" fill="#183b34" font-size="22" font-weight="600" text-anchor="start">ASSESS THE CATEGORY / SITE</text><text x="615" y="215" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">EASA / AESA framework + geographic zones</text><text x="615" y="244" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Do not assume open-category eligibility</text><path d="M535 210 L585 210" fill="none" stroke="#317d74" stroke-width="4" marker-end="url(#arrow)" /><rect x="55" y="365" width="470" height="125" rx="18" fill="#e2eadb" stroke="#b7c7b4"/><text x="75" y="401" fill="#183b34" font-size="22" font-weight="600" text-anchor="start">PLAN THE CONTROLS</text><text x="75" y="430" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Personnel, authorisation where required</text><text x="75" y="459" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Emergency response and operating limits</text><rect x="595" y="365" width="470" height="125" rx="18" fill="#f0debf" stroke="#b7c7b4"/><text x="615" y="401" fill="#183b34" font-size="22" font-weight="600" text-anchor="start">VERIFY BEFORE DEPLOYMENT</text><text x="615" y="430" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Current rules + actual site + complete system</text><text x="615" y="459" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">This reader provides no flight clearance</text><path d="M825 290 L825 350" fill="none" stroke="#317d74" stroke-width="4" marker-end="url(#arrow)" /><path d="M585 427 L535 427" fill="none" stroke="#317d74" stroke-width="4" marker-end="url(#arrow)" /><text x="44" y="591" fill="#65736a" font-size="16" font-weight="400" text-anchor="start">Explanatory schematic · author illustration · not to scale or validated hardware</text></g></svg>