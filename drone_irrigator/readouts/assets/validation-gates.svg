<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img"><title>Build confidence in four measured stages</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#317d74"/></marker></defs><rect width="1120" height="620" rx="24" fill="#f5f1e7"/><g font-family="Segoe UI,Arial,sans-serif"><text x="44" y="58" fill="#183b34" font-size="32" font-weight="700" text-anchor="start">Build confidence in four measured stages</text><text x="44" y="94" fill="#52675e" font-size="19" font-weight="400" text-anchor="start">Keep operational throughput separate from biological establishment outcomes.</text><rect x="45" y="170" width="245" height="260" rx="18" fill="#e2eadb" stroke="#b7c7b4"/><text x="65" y="206" fill="#183b34" font-size="22" font-weight="600" text-anchor="start">1 · RESERVOIR</text><text x="65" y="235" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Retained useful volume</text><text x="65" y="264" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Leakage + acceptance flow</text><text x="65" y="293" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Repeated wet strength</text><rect x="310" y="170" width="245" height="260" rx="18" fill="#e2eadb" stroke="#b7c7b4"/><text x="330" y="206" fill="#183b34" font-size="22" font-weight="600" text-anchor="start">2 · INTERFACE</text><text x="330" y="235" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Capture + disengage</text><text x="330" y="264" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Spill / miss / recovery</text><text x="330" y="293" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Handling time + damage</text><rect x="575" y="170" width="245" height="260" rx="18" fill="#e2eadb" stroke="#b7c7b4"/><text x="595" y="206" fill="#183b34" font-size="22" font-weight="600" text-anchor="start">3 · SERVICE CYCLE</text><text x="595" y="235" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Loaded flight + reserve</text><text x="595" y="264" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Water / battery base time</text><text x="595" y="293" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Human interventions</text><rect x="840" y="170" width="245" height="260" rx="18" fill="#e2eadb" stroke="#b7c7b4"/><text x="860" y="206" fill="#183b34" font-size="22" font-weight="600" text-anchor="start">4 · PLANTS / VALUE</text><text x="860" y="235" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Water status + survival</text><text x="860" y="264" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Matched ground baseline</text><text x="860" y="293" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Lifecycle cost / service</text><text x="302" y="490" fill="#183b34" font-size="23" font-weight="600" text-anchor="start">Measure failed attempts and missed deadlines, too.</text><text x="44" y="591" fill="#65736a" font-size="16" font-weight="400" text-anchor="start">Explanatory schematic · author illustration · not to scale or validated hardware</text></g></svg>