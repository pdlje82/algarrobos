<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img"><title>The inlet is part of the robotics problem</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#317d74"/></marker></defs><rect width="1120" height="620" rx="24" fill="#f5f1e7"/><g font-family="Segoe UI,Arial,sans-serif"><text x="44" y="58" fill="#183b34" font-size="32" font-weight="700" text-anchor="start">The inlet is part of the robotics problem</text><text x="44" y="94" fill="#52675e" font-size="19" font-weight="400" text-anchor="start">Illustrated funnel capture is a development option, not a proven product.</text><g transform="translate(275 200) scale(1.15)"><path d="M-48 -27 L48 27 M-48 27 L48 -27" stroke="#183b34" stroke-width="9"/><rect x="-20" y="-19" width="40" height="38" rx="12" fill="#317d74"/><ellipse cx="-48" cy="-27" rx="27" ry="8" fill="#c1d8ce" stroke="#183b34" stroke-width="3"/><ellipse cx="48" cy="27" rx="27" ry="8" fill="#c1d8ce" stroke="#183b34" stroke-width="3"/><ellipse cx="-48" cy="27" rx="27" ry="8" fill="#c1d8ce" stroke="#183b34" stroke-width="3"/><ellipse cx="48" cy="-27" rx="27" ry="8" fill="#c1d8ce" stroke="#183b34" stroke-width="3"/></g><path d="M275 220 C280 300 370 300 370 385" stroke="#324d4b" stroke-width="9" fill="none"/><path d="M305 360 L370 450 L435 360" fill="#ddb26b" stroke="#886c42" stroke-width="4"/><rect x="300" y="455" width="140" height="70" rx="24" fill="#c8a473"/><rect x="610" y="160" width="455" height="112" rx="18" fill="#e2eadb" stroke="#b7c7b4"/><text x="630" y="196" fill="#183b34" font-size="22" font-weight="600" text-anchor="start">FIND AND APPROACH</text><text x="630" y="225" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Localise the inlet; account for wind and vegetation.</text><rect x="610" y="305" width="455" height="112" rx="18" fill="#e2eadb" stroke="#b7c7b4"/><text x="630" y="341" fill="#183b34" font-size="22" font-weight="600" text-anchor="start">CAPTURE AND TRANSFER</text><text x="630" y="370" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Verify engagement, flow and retained useful water.</text><rect x="610" y="450" width="455" height="85" rx="18" fill="#e2eadb" stroke="#b7c7b4"/><text x="630" y="486" fill="#183b34" font-size="22" font-weight="600" text-anchor="start">DISENGAGE AND VERIFY</text><text x="630" y="515" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Avoid damage, drips and hose snagging.</text><path d="M835 280 L835 296" fill="none" stroke="#317d74" stroke-width="4" marker-end="url(#arrow)" /><path d="M835 425 L835 442" fill="none" stroke="#317d74" stroke-width="4" marker-end="url(#arrow)" /><text x="44" y="591" fill="#65736a" font-size="16" font-weight="400" text-anchor="start">Explanatory schematic · author illustration · not to scale or validated hardware</text></g></svg>