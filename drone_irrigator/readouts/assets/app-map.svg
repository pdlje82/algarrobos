<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img"><title>From a readable story to the exact evidence</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#317d74"/></marker></defs><rect width="1120" height="620" rx="24" fill="#f5f1e7"/><g font-family="Segoe UI,Arial,sans-serif"><text x="44" y="58" fill="#183b34" font-size="32" font-weight="700" text-anchor="start">From a readable story to the exact evidence</text><text x="44" y="94" fill="#52675e" font-size="19" font-weight="400" text-anchor="start">Knowledge Explorer is the entry point; reading does not adopt rules.</text><rect x="45" y="170" width="310" height="115" rx="18" fill="#e2eadb" stroke="#b7c7b4"/><text x="65" y="206" fill="#183b34" font-size="22" font-weight="600" text-anchor="start">1 · ILLUSTRATED READER</text><text x="65" y="235" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Access guide + 11 readouts</text><rect x="410" y="170" width="310" height="115" rx="18" fill="#e2eadb" stroke="#b7c7b4"/><text x="430" y="206" fill="#183b34" font-size="22" font-weight="600" text-anchor="start">2 · STRUCTURED RECORD</text><text x="430" y="235" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Profile, product or work package</text><rect x="775" y="170" width="300" height="115" rx="18" fill="#e2eadb" stroke="#b7c7b4"/><text x="795" y="206" fill="#183b34" font-size="22" font-weight="600" text-anchor="start">3 · SOURCE PASSAGE</text><text x="795" y="235" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Checked PDF edition + page</text><path d="M360 225 L405 225" fill="none" stroke="#317d74" stroke-width="4" marker-end="url(#arrow)" /><path d="M725 225 L770 225" fill="none" stroke="#317d74" stroke-width="4" marker-end="url(#arrow)" /><rect x="210" y="380" width="700" height="115" rx="18" fill="#f0debf" stroke="#b7c7b4"/><text x="230" y="416" fill="#183b34" font-size="22" font-weight="600" text-anchor="start">REVIEW BEFORE OPERATIONAL USE</text><text x="230" y="445" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Prepared clusters / inputs remain unadopted.</text><text x="230" y="474" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Unknown water demand remains unknown.</text><path d="M550 300 L550 370" fill="none" stroke="#317d74" stroke-width="4" marker-end="url(#arrow)" /><text x="44" y="591" fill="#65736a" font-size="16" font-weight="400" text-anchor="start">Explanatory schematic · author illustration · not to scale or validated hardware</text></g></svg>