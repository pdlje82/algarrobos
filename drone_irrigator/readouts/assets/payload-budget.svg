<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img"><title>Water competes for payload with its own delivery equipment</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#317d74"/></marker></defs><rect width="1120" height="620" rx="24" fill="#f5f1e7"/><g font-family="Segoe UI,Arial,sans-serif"><text x="44" y="58" fill="#183b34" font-size="32" font-weight="700" text-anchor="start">Water competes for payload with its own delivery equipment</text><text x="44" y="94" fill="#52675e" font-size="19" font-weight="400" text-anchor="start">An airframe rating is not a useful water payload or loaded flight duration.</text><g transform="translate(560 170) scale(1.2)"><path d="M-48 -27 L48 27 M-48 27 L48 -27" stroke="#183b34" stroke-width="9"/><rect x="-20" y="-19" width="40" height="38" rx="12" fill="#317d74"/><ellipse cx="-48" cy="-27" rx="27" ry="8" fill="#c1d8ce" stroke="#183b34" stroke-width="3"/><ellipse cx="48" cy="27" rx="27" ry="8" fill="#c1d8ce" stroke="#183b34" stroke-width="3"/><ellipse cx="-48" cy="27" rx="27" ry="8" fill="#c1d8ce" stroke="#183b34" stroke-width="3"/><ellipse cx="48" cy="-27" rx="27" ry="8" fill="#c1d8ce" stroke="#183b34" stroke-width="3"/></g><rect x="70" y="280" width="300" height="140" rx="18" fill="#e2eadb" stroke="#b7c7b4"/><text x="90" y="316" fill="#183b34" font-size="22" font-weight="600" text-anchor="start">FITTED AIRCRAFT</text><text x="90" y="345" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Airframe + batteries</text><text x="90" y="374" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Already configured equipment</text><rect x="410" y="280" width="300" height="140" rx="18" fill="#e2eadb" stroke="#b7c7b4"/><text x="430" y="316" fill="#183b34" font-size="22" font-weight="600" text-anchor="start">WATERING KIT</text><text x="430" y="345" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Tank + pump + hose</text><text x="430" y="374" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Guidance + fittings</text><rect x="750" y="280" width="300" height="140" rx="18" fill="#e2eadb" stroke="#b7c7b4"/><text x="770" y="316" fill="#183b34" font-size="22" font-weight="600" text-anchor="start">USEFUL WATER</text><text x="770" y="345" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Remaining verified capacity</text><text x="770" y="374" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Return reserve still required</text><text x="380" y="364" fill="#183b34" font-size="30" font-weight="400" text-anchor="start">+</text><text x="720" y="364" fill="#183b34" font-size="30" font-weight="400" text-anchor="start">+</text><rect x="180" y="457" width="760" height="75" rx="18" fill="#f0debf" stroke="#b7c7b4"/><text x="200" y="493" fill="#183b34" font-size="22" font-weight="600" text-anchor="start">Validate the complete fitted mass and loaded sortie together.</text><text x="44" y="591" fill="#65736a" font-size="16" font-weight="400" text-anchor="start">Explanatory schematic · author illustration · not to scale or validated hardware</text></g></svg>