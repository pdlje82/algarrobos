<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img"><title>A dock is only as autonomous as the whole refill cycle</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#317d74"/></marker></defs><rect width="1120" height="620" rx="24" fill="#f5f1e7"/><g font-family="Segoe UI,Arial,sans-serif"><text x="44" y="58" fill="#183b34" font-size="32" font-weight="700" text-anchor="start">A dock is only as autonomous as the whole refill cycle</text><text x="44" y="94" fill="#52675e" font-size="19" font-weight="400" text-anchor="start">Battery automation does not establish water-service automation.</text><rect x="45" y="155" width="315" height="170" rx="18" fill="#e2eadb" stroke="#b7c7b4"/><text x="65" y="191" fill="#183b34" font-size="22" font-weight="600" text-anchor="start">BATTERY / POWER</text><text x="65" y="220" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Compatible aircraft</text><text x="65" y="249" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Swap / charge / return</text><text x="65" y="278" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Documented component</text><rect x="405" y="155" width="315" height="170" rx="18" fill="#e2eadb" stroke="#b7c7b4"/><text x="425" y="191" fill="#183b34" font-size="22" font-weight="600" text-anchor="start">WATER SERVICE</text><text x="425" y="220" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Tank + pump + coupling</text><text x="425" y="249" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Metered transfer + leaks</text><text x="425" y="278" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Integration to be developed</text><rect x="765" y="155" width="315" height="170" rx="18" fill="#e2eadb" stroke="#b7c7b4"/><text x="785" y="191" fill="#183b34" font-size="22" font-weight="600" text-anchor="start">OPERATIONS</text><text x="785" y="220" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Water resupply + maintenance</text><text x="785" y="249" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Communications + weather</text><text x="785" y="278" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Human interventions recorded</text><path d="M205 345 L205 405" fill="none" stroke="#317d74" stroke-width="4" marker-end="url(#arrow)" /><path d="M565 345 L565 405" fill="none" stroke="#317d74" stroke-width="4" marker-end="url(#arrow)" /><path d="M925 345 L925 405" fill="none" stroke="#317d74" stroke-width="4" marker-end="url(#arrow)" /><rect x="45" y="420" width="1035" height="100" rx="18" fill="#f0debf" stroke="#b7c7b4"/><text x="65" y="456" fill="#183b34" font-size="22" font-weight="600" text-anchor="start">ONE COMPLETE CYCLE</text><text x="65" y="485" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Arrive → safe service → sufficient water and energy → depart → return safely</text><text x="44" y="591" fill="#65736a" font-size="16" font-weight="400" text-anchor="start">Explanatory schematic · author illustration · not to scale or validated hardware</text></g></svg>