<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img"><title>More visits are useful only if plants get enough water</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#317d74"/></marker></defs><rect width="1120" height="620" rx="24" fill="#f5f1e7"/><g font-family="Segoe UI,Arial,sans-serif"><text x="44" y="58" fill="#183b34" font-size="32" font-weight="700" text-anchor="start">More visits are useful only if plants get enough water</text><text x="44" y="94" fill="#52675e" font-size="19" font-weight="400" text-anchor="start">No numerical capacity estimate is defensible until the inputs are explicit.</text><rect x="55" y="155" width="470" height="132" rx="18" fill="#e2eadb" stroke="#b7c7b4"/><text x="75" y="191" fill="#183b34" font-size="22" font-weight="600" text-anchor="start">TIME / CAPACITY</text><text x="75" y="220" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Travel + acquisition + transfer + return</text><text x="75" y="249" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Base service + weather + human support</text><rect x="595" y="155" width="470" height="132" rx="18" fill="#e2eadb" stroke="#b7c7b4"/><text x="615" y="191" fill="#183b34" font-size="22" font-weight="600" text-anchor="start">PLANT / RESERVOIR</text><text x="615" y="220" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Useful refill volume + demand + losses</text><text x="615" y="249" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Deadline margin + reservoir service life</text><path d="M530 220 L585 220" fill="none" stroke="#317d74" stroke-width="4" marker-end="url(#arrow)" /><path d="M585 255 L535 255" fill="none" stroke="#317d74" stroke-width="4" marker-end="url(#arrow)" /><rect x="155" y="390" width="810" height="115" rx="18" fill="#f0debf" stroke="#b7c7b4"/><text x="175" y="426" fill="#183b34" font-size="22" font-weight="600" text-anchor="start">COMPARE THE SAME JOB</text><text x="175" y="455" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Same layout, season, plant outcomes, horizon and water inventory.</text><text x="175" y="484" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Report costs, useful litres and deadline failures alongside throughput.</text><text x="44" y="591" fill="#65736a" font-size="16" font-weight="400" text-anchor="start">Explanatory schematic · author illustration · not to scale or validated hardware</text></g></svg>