<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img"><title>Three separate questions for every plant</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#317d74"/></marker></defs><rect width="1120" height="620" rx="24" fill="#f5f1e7"/><g font-family="Segoe UI,Arial,sans-serif"><text x="44" y="58" fill="#183b34" font-size="32" font-weight="700" text-anchor="start">Three separate questions for every plant</text><text x="44" y="94" fill="#52675e" font-size="19" font-weight="400" text-anchor="start">A species name alone answers none of these completely.</text><g transform="translate(147 338) scale(1.1)"><path d="M0 0 L0 -64" stroke="#946b43" stroke-width="10"/><circle cx="0" cy="-84" r="39" fill="#407d55"/><circle cx="-23" cy="-66" r="29" fill="#609565"/><circle cx="25" cy="-67" r="30" fill="#54875b"/></g><rect x="290" y="150" width="770" height="98" rx="18" fill="#e2eadb" stroke="#b7c7b4"/><text x="310" y="186" fill="#183b34" font-size="22" font-weight="600" text-anchor="start">1 · SUITABILITY</text><text x="310" y="215" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Exact species + nursery stock + reservoir + site</text><rect x="290" y="283" width="770" height="98" rx="18" fill="#e2eadb" stroke="#b7c7b4"/><text x="310" y="319" fill="#183b34" font-size="22" font-weight="600" text-anchor="start">2 · WATER NEED</text><text x="310" y="348" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Establishment stage + soil + weather + useful delivery</text><rect x="290" y="416" width="770" height="98" rx="18" fill="#e2eadb" stroke="#b7c7b4"/><text x="310" y="452" fill="#183b34" font-size="22" font-weight="600" text-anchor="start">3 · PHYSICAL FIT</text><text x="310" y="481" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Root plug + reservoir opening + shelter + refill access</text><path d="M190 255 L280 206" fill="none" stroke="#317d74" stroke-width="4" marker-end="url(#arrow)" /><path d="M205 330 L280 330" fill="none" stroke="#317d74" stroke-width="4" marker-end="url(#arrow)" /><path d="M190 390 L280 463" fill="none" stroke="#317d74" stroke-width="4" marker-end="url(#arrow)" /><text x="44" y="591" fill="#65736a" font-size="16" font-weight="400" text-anchor="start">Explanatory schematic · author illustration · not to scale or validated hardware</text></g></svg>