<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img"><title>Intelligence at the drone. Simplicity at each plant.</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#317d74"/></marker></defs><rect width="1120" height="620" rx="24" fill="#f5f1e7"/><g font-family="Segoe UI,Arial,sans-serif"><text x="44" y="58" fill="#183b34" font-size="32" font-weight="700" text-anchor="start">Intelligence at the drone. Simplicity at each plant.</text><text x="44" y="94" fill="#52675e" font-size="19" font-weight="400" text-anchor="start">The proposed service cycle; component integration still requires development.</text><rect x="45" y="180" width="245" height="240" rx="18" fill="#e2eadb" stroke="#b7c7b4"/><text x="65" y="216" fill="#183b34" font-size="22" font-weight="600" text-anchor="start">REMOTE BASE</text><text x="65" y="245" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Stored water</text><text x="65" y="274" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Power + battery service</text><text x="65" y="303" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Human support as needed</text><g transform="translate(538 220) scale(1.1)"><path d="M-48 -27 L48 27 M-48 27 L48 -27" stroke="#183b34" stroke-width="9"/><rect x="-20" y="-19" width="40" height="38" rx="12" fill="#317d74"/><ellipse cx="-48" cy="-27" rx="27" ry="8" fill="#c1d8ce" stroke="#183b34" stroke-width="3"/><ellipse cx="48" cy="27" rx="27" ry="8" fill="#c1d8ce" stroke="#183b34" stroke-width="3"/><ellipse cx="-48" cy="27" rx="27" ry="8" fill="#c1d8ce" stroke="#183b34" stroke-width="3"/><ellipse cx="48" cy="-27" rx="27" ry="8" fill="#c1d8ce" stroke="#183b34" stroke-width="3"/></g><rect x="406" y="321" width="265" height="100" rx="18" fill="#e2eadb" stroke="#b7c7b4"/><text x="426" y="357" fill="#183b34" font-size="22" font-weight="600" text-anchor="s