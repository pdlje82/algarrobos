<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img"><title>What the drone would actually have to refill</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#317d74"/></marker></defs><rect width="1120" height="620" rx="24" fill="#f5f1e7"/><g font-family="Segoe UI,Arial,sans-serif"><text x="44" y="58" fill="#183b34" font-size="32" font-weight="700" text-anchor="start">What the drone would actually have to refill</text><text x="44" y="94" fill="#52675e" font-size="19" font-weight="400" text-anchor="start">A passive capture guide is a proposal, not a reviewed commercial interface.</text><path d="M40 390 H1080 V548 H40z" fill="#d8c19f"/><path d="M110 360 H270 L290 465 H90z" fill="#b58a55"/><path d="M122 376 H257 L274 445 H107z" fill="#69b5c4"/><g transform="translate(530 390) scale(1.3)"><path d="M0 0 L0 -64" stroke="#946b43" stroke-width="10"/><circle cx="0" cy="-84" r="39" fill="#407d55"/><circle cx="-23" cy="-66" r="29" fill="#609565"/><circle cx="25" cy="-67" r="30" fill="#54875b"/></g><g transform="translate(870 195) scale(1.1)"><path d="M-48 -27 L48 27 M-48 27 L48 -27" stroke="#183b34" stroke-width="9"/><rect x="-20" y="-19" width="40" height="38" rx="12" fill="#317d74"/><ellipse cx="-48" cy="-27" rx="27" ry="8" fill="#c1d8ce" stroke="#183b34" stroke-width="3"/><ellipse cx="48" cy="27" rx="27" ry="8" fill="#c1d8ce" stroke="#183b34" stroke-width="3"/><ellipse cx="-48" cy="27" rx="27" ry="8" fill="#c1d8ce" stroke="#183b34" stroke-width="3"/><ellipse cx="48" cy="-27" rx="27" ry="8" fill="#c1d8ce" stroke="#183b34" stroke-width="3"/></g><path d="M870 219 C875 320 790 290 790 370" stroke="#324d4b" stroke-width="8" fill="none"/><path d="M755 358 L790 410 L825 358" fill="#ddb26b" stroke="#886c42" stroke-width="3"/><rect x="60" y="145" width="320" height="120" rx="18" fill="#e2eadb" stroke="#b7c7b4"/><text x="80" y="181" fill="#183b34" font-size="22" font-weight="600" text-anchor="start">RESERVOIR QUESTIONS</text><text x="80" y="210" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Usable retained volume?</text><text x="80" y="239" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Repeated wet strength?</text><rect x="650" y="445" width="400" height="98" rx="18" fill="#e2eadb" stroke="#b7c7b4"/><text x="670" y="481" fill="#183b34" font-size="22" font-weight="600" text-anchor="start">INTERFACE QUESTIONS</text><text x="670" y="510" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Capture, fill acceptance, disengage?</text><path d="M245 280 L197 351" fill="none" stroke="#317d74" stroke-width="4" marker-end="url(#arrow)" /><path d="M800 429 L797 402" fill="none" stroke="#317d74" stroke-width="4" marker-end="url(#arrow)" /><text x="44" y="591" fill="#65736a" font-size="16" font-weight="400" text-anchor="start">Explanatory schematic · author illustration · not to scale or validated hardware</text></g></svg>