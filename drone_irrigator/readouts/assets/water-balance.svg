<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img"><title>A disappearing litre is not necessarily a useful litre</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#317d74"/></marker></defs><rect width="1120" height="620" rx="24" fill="#f5f1e7"/><g font-family="Segoe UI,Arial,sans-serif"><text x="44" y="58" fill="#183b34" font-size="32" font-weight="700" text-anchor="start">A disappearing litre is not necessarily a useful litre</text><text x="44" y="94" fill="#52675e" font-size="19" font-weight="400" text-anchor="start">Release, plant need, losses and rainfall must be accounted for separately.</text><rect x="45" y="175" width="280" height="135" rx="18" fill="#e2eadb" stroke="#b7c7b4"/><text x="65" y="211" fill="#183b34" font-size="22" font-weight="600" text-anchor="start">RESERVOIR</text><text x="65" y="240" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Initial water + top-ups</text><text x="65" y="269" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">+ effective captured rain</text><rect x="422" y="175" width="280" height="135" rx="18" fill="#e2eadb" stroke="#b7c7b4"/><text x="442" y="211" fill="#183b34" font-size="22" font-weight="600" text-anchor="start">ROOT ZONE</text><text x="442" y="240" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Useful delivered water</text><text x="442" y="269" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Soil / root conditions</text><rect x="798" y="175" width="280" height="135" rx="18" fill="#e2eadb" stroke="#b7c7b4"/><text x="818" y="211" fill="#183b34" font-size="22" font-weight="600" text-anchor="start">PLANT</text><text x="818" y="240" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Supplemental need</text><text x="818" y="269" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Changes with conditions</text><path d="M335 235 L412 235" fill="none" stroke="#317d74" stroke-width="4" marker-end="url(#arrow)" /><path d="M712 235 L788 235" fill="none" stroke="#317d74" stroke-width="4" marker-end="url(#arrow)" /><path d="M175 325 L175 417" fill="none" stroke="#317d74" stroke-width="4" marker-end="url(#arrow)" /><rect x="45" y="432" width="500" height="90" rx="18" fill="#f0debf" stroke="#b7c7b4"/><text x="65" y="468" fill="#183b34" font-size="22" font-weight="600" text-anchor="start">LOSSES / UNAVAILABLE WATER</text><text x="65" y="497" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Evaporation, leakage, bypass, retained dead volume</text><rect x="610" y="400" width="470" height="125" rx="18" fill="#e2eadb" stroke="#b7c7b4"/><text x="630" y="436" fill="#183b34" font-size="22" font-weight="600" text-anchor="start">NO UNIVERSAL COUNTDOWN</text><text x="630" y="465" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Refill interval needs measured inputs.</text><text x="630" y="494" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">All 23 daily-rate profiles remain unknown.</text><text x="44" y="591" fill="#65736a" font-size="16" font-weight="400" text-anchor="start">Explanatory schematic · author illustration · not to scale or validated hardware</text></g></svg>