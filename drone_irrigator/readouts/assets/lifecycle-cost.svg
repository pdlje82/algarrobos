<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img"><title>Cheap to buy is only one part of the cost</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#317d74"/></marker></defs><rect width="1120" height="620" rx="24" fill="#f5f1e7"/><g font-family="Segoe UI,Arial,sans-serif"><text x="44" y="58" fill="#183b34" font-size="32" font-weight="700" text-anchor="start">Cheap to buy is only one part of the cost</text><text x="44" y="94" fill="#52675e" font-size="19" font-weight="400" text-anchor="start">Compare a common establishment period and equivalent service outcomes.</text><rect x="40" y="165" width="325" height="140" rx="18" fill="#e2eadb" stroke="#b7c7b4"/><text x="60" y="201" fill="#183b34" font-size="22" font-weight="600" text-anchor="start">RESERVOIR</text><text x="60" y="230" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Purchase + delivery</text><text x="60" y="259" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Install + inlet adaptation</text><rect x="398" y="165" width="325" height="140" rx="18" fill="#e2eadb" stroke="#b7c7b4"/><text x="418" y="201" fill="#183b34" font-size="22" font-weight="600" text-anchor="start">SERVICE</text><text x="418" y="230" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Water + energy + labour</text><text x="418" y="259" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Drone / base / batteries</text><rect x="756" y="165" width="325" height="140" rx="18" fill="#e2eadb" stroke="#b7c7b4"/><text x="776" y="201" fill="#183b34" font-size="22" font-weight="600" text-anchor="start">REPLACEMENT / REUSE</text><text x="776" y="230" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Failure + retrieval</text><text x="776" y="259" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Cleaning + storage</text><text x="379" y="245" fill="#183b34" font-size="30" font-weight="700" text-anchor="start">+</text><text x="736" y="245" fill="#183b34" font-size="30" font-weight="700" text-anchor="start">+</text><path d="M560 330 L560 394" fill="none" stroke="#317d74" stroke-width="4" marker-end="url(#arrow)" /><rect x="185" y="405" width="750" height="120" rx="18" fill="#f0debf" stroke="#b7c7b4"/><text x="205" y="441" fill="#183b34" font-size="22" font-weight="600" text-anchor="start">COMPARE COST PER ESTABLISHED PLANT</text><text x="205" y="470" fill="#183b34" font-size="22" font-weight="400" text-anchor="start">Keep survival, visit frequency and service horizon explicit.</text><text x="44" y="591" fill="#65736a" font-size="16" font-weight="400" text-anchor="start">Explanatory schematic · author illustration · not to scale or validated hardware</text></g></svg>